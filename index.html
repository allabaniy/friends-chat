<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friends Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#17202a}button,input{font:inherit}button{cursor:pointer}#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;width:100%;max-width:420px;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0002}.logo{text-align:center;font-size:30px;font-weight:700;margin-bottom:20px}.tabs{display:flex;margin-bottom:18px}.tabs button{flex:1;padding:11px;border:0;background:#eee}.tabs .active{background:#1769e0;color:#fff}.form{display:flex;flex-direction:column;gap:12px}.form input,.search input,.composer input{padding:13px;border:1px solid #d0d5dd;border-radius:10px;outline:0}.primary,.send{border:0;background:#1769e0;color:#fff;padding:13px;border-radius:10px;font-weight:700}.msg{text-align:center;min-height:20px;font-size:14px}.hidden{display:none!important}#app{height:100vh;display:none}.side{width:330px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}.head{padding:16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:700}.logout{background:#d92d20;color:#fff;border:0;border-radius:8px;padding:8px}.me{padding:12px 16px;border-bottom:1px solid #eee;color:#667085;font-size:14px}.search{padding:12px}.search input{width:100%}.users{overflow:auto;flex:1}.user{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:0;padding:13px 16px}.user:hover{background:#f3f6fb}.avatar{width:44px;height:44px;border-radius:50%;background:#1769e0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.info{min-width:0}.name{font-weight:700}.small{font-size:13px;color:#777}.online{font-size:12px;color:#12b76a}.offline{color:#98a2b3}.chat{flex:1;display:flex;flex-direction:column}.empty{margin:auto;text-align:center;color:#777}.chathead{background:#fff;border-bottom:1px solid #ddd;padding:13px 18px;display:flex;gap:12px;align-items:center}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:#e9eef3}.bubble{max-width:70%;padding:10px 13px;border-radius:14px;word-wrap:break-word}.mine{align-self:flex-end;background:#d9fdd3}.theirs{align-self:flex-start;background:#fff}.time{font-size:10px;color:#777;text-align:right;margin-top:4px}.composer{background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;gap:10px}.composer input{flex:1;border-radius:22px}.send{border-radius:22px;padding:0 20px}@media(max-width:700px){.side{width:100%}.chat{display:none}#app.open .side{display:none}#app.open .chat{display:flex}.back{display:block!important}}.back{display:none;border:0;background:0;font-size:26px}
</style>
</head>
<body>
<section id="auth"><div class="card"><div class="logo">Friends Chat</div><div class="tabs"><button id="lt" class="active">Login</button><button id="rt">Register</button></div><form id="login" class="form"><input id="lu" placeholder="Username" required><input id="lp" type="password" placeholder="Password" required><button class="primary">Login</button><div id="lm" class="msg"></div></form><form id="register" class="form hidden"><input id="rn" placeholder="Display name" required><input id="ru" placeholder="Username" required><input id="rp" type="password" placeholder="Password" required><input id="rc" placeholder="Country"><button class="primary">Create account</button><div id="rm" class="msg"></div></form></div></section>
<section id="app"><aside class="side"><div class="head"><div class="title">Friends Chat</div><button id="logout" class="logout">Logout</button></div><div id="me" class="me"></div><div class="search"><input id="search" placeholder="Search friends..."></div><div id="users" class="users"></div></aside><main class="chat"><div id="empty" class="empty"><h2>Select a friend</h2><p>Choose someone to start chatting.</p></div><div id="view" class="hidden" style="height:100%;display:flex;flex-direction:column"><div class="chathead"><button id="back" class="back">‹</button><div id="ca" class="avatar">?</div><div><b id="cn"></b><div id="cc" class="small"></div></div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="mi" placeholder="Type a message..." autocomplete="off"><button class="send">Send</button></form></div></main></section>
<script>
const API='https://singer-finisher-scouring.ngrok-free.dev/webhook';let me=null,chat=null;
const $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const t=await r.text();let x={};try{x=t?JSON.parse(t):{}}catch{throw Error('Server returned invalid JSON')}if(!r.ok)throw Error(x.error||('Request failed: '+r.status));return x}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function tabs(login){$('lt').classList.toggle('active',login);$('rt').classList.toggle('active',!login);$('login').classList.toggle('hidden',!login);$('register').classList.toggle('hidden',login)}
$('lt').onclick=()=>tabs(true);$('rt').onclick=()=>tabs(false);
$('register').onsubmit=async e=>{e.preventDefault();$('rm').textContent='Creating account...';try{let x=await api('/friends/register',{display_name:$('rn').value.trim(),username:$('ru').value.trim(),password:$('rp').value,country:$('rc').value.trim(),avatar_url:''});if(x.ok===false)throw Error(x.error);$('rm').textContent='Account created. You can now log in.';$('register').reset();setTimeout(()=>{tabs(true);$('rm').textContent=''},800)}catch(err){$('rm').textContent=err.message}};
$('login').onsubmit=async e=>{e.preventDefault();$('lm').textContent='Logging in...';try{let x=await api('/friends/login',{username:$('lu').value.trim(),password:$('lp').value});if(!x.ok||!x.user)throw Error(x.error||'Invalid username or password');me=x.user;await status('online');$('auth').style.display='none';$('app').style.display='flex';$('me').textContent=me.user_name+'  @'+me.username;await loadUsers()}catch(err){$('lm').textContent=err.message}};
async function status(s){if(!me)return;try{await api('/friends/status',{user_id:me.user_id,status:s})}catch(e){}}
async function loadUsers(){try{let x=await api('/friends/users',{search:$('search').value.trim()});let list=Array.isArray(x)?x:(x.users||[]);$('users').innerHTML='';list.filter(u=>u.user_id!==me.user_id).forEach(u=>{let b=document.createElement('button');b.className='user';b.innerHTML='<div class="avatar">'+esc((u.user_name||u.username||'?')[0].toUpperCase())+'</div><div class="info"><div class="name">'+esc(u.user_name||u.username)+'</div><div class="small">@'+esc(u.username||'')+'</div><div class="'+(u.status==='offline'?'offline':'online')+'">'+esc(u.status||'offline')+'</div></div>';b.onclick=()=>openChat(u);$('users').appendChild(b)});if(!$('users').children.length)$('users').innerHTML='<div style="padding:20px;color:#777">No friends found.</div>'}catch(e){$('users').innerHTML='<div style="padding:20px;color:#d92d20">'+esc(e.message)+'</div>'}}
$('search').oninput=loadUsers;
async function openChat(u){chat=u;$('app').classList.add('open');$('empty').classList.add('hidden');$('view').classList.remove('hidden');$('view').style.display='flex';$('cn').textContent=u.user_name||u.username;$('cc').textContent=u.country||'';$('ca').textContent=(u.user_name||u.username||'?')[0].toUpperCase();await conversation()}
async function conversation(){try{let x=await api('/friends/conversation',{user_id:me.user_id,other_user_id:chat.user_id});let list=Array.isArray(x)?x:(x.messages||[]);$('messages').innerHTML='';if(!list.length)$('messages').innerHTML='<div style="text-align:center;color:#777">No messages yet. Say hello!</div>';list.forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.sender_id===me.user_id?'mine':'theirs');d.innerHTML=esc(m.message||'')+'<div class="time">'+time(m.sent_at)+'</div>';$('messages').appendChild(d);if(m.receiver_id===me.user_id&&String(m.read_status).toLowerCase()!=='read')api('/friends/read',{message_id:m.message_id}).catch(()=>{})});$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('messages').innerHTML='<div style="color:#d92d20">'+esc(e.message)+'</div>'}}
$('composer').onsubmit=async e=>{e.preventDefault();let text=$('mi').value.trim();if(!text||!chat)return;$('mi').disabled=true;try{let x=await api('/friends/send',{sender_id:me.user_id,receiver_id:chat.user_id,message:text,message_type:'text',file_url:''});if(x.ok===false)throw Error(x.error);$('mi').value='';await conversation()}catch(e){alert(e.message)}finally{$('mi').disabled=false;$('mi').focus()}};
$('back').onclick=()=>{$('app').classList.remove('open');chat=null;$('view').classList.add('hidden');$('empty').classList.remove('hidden')};
$('logout').onclick=async()=>{await status('offline');me=null;chat=null;$('app').style.display='none';$('auth').style.display='flex';$('login').reset();$('lm').textContent=''};
function time(v){if(!v)return'';let d=new Date(v);return isNaN(d)?String(v):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
window.addEventListener('beforeunload',()=>{if(me)navigator.sendBeacon(API+'/friends/status',new Blob([JSON.stringify({user_id:me.user_id,status:'offline'})],{type:'application/json'}))});
</script></body></html>
